<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <!-- tailwind and daisy ui -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- gooogle font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awsome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-[#F8FAFC]">
    <header class="bg-white flex justify-between items-center px-20 py-5">
        <div class=" flex  justify-center items-center gap-1.5">
            <img class="h-8" src="./assets/github-logo.png" alt="">
            <h2 class="font-semibold text-6">GitHub Issues Tracker</h2>
        </div>
        <div>
           <div class="join gap-2">
            <div>
                <label class="input validator join-item"> 
                    <div><i class="fa-brands fa-sistrix"></i></div>
                    <input type="text" id="input-search" placeholder="issues..." required />
                </label>
            </div>
            <button id="btn-search" class="btn btn-primary join-item">+ New Issue</button>
            </div> 
        </div>
    </header>
    <section class="bg-white w-[80%] mx-auto p-4 mt-[60px]">
        <button id="tab-all" onclick="switchTab('all')" class="btn px-8 py-2.5" >All</button>
        <button id="tab-open" onclick="switchTab('open')" class="btn  px-8 py-2.5">Open</button>
        <button id="tab-close" onclick="switchTab('close')" class="btn  px-8 py-2.5">Closed</button>
    </section>
    <section class="flex w-[80%] mx-auto bg-white mt-4 p-6">
        <div>
            <img src="./assets/Aperture.png" alt="">
        </div>
        <div>
            <h2>50 Issue</h2>
            <p>Track and manage your project issues</p>
        </div>
    </section>
    <script src="./script.js/main.js"></script>
    
</body>
</html>
