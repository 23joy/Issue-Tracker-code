<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <!-- tailwind and daisy ui -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- gooogle font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awsome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-[#F8FAFC]">


    <!-- header section -->
    <header class="bg-white flex justify-between items-center px-20 py-5">
        <div class=" flex  justify-center items-center gap-1.5">
            <img class="h-8" src="./assets/github-logo.png" alt="">
            <h2 class="font-semibold text-6">GitHub Issues Tracker</h2>
        </div>
        <div>
           <div class="join gap-2">
            <div>
                <label class="input validator join-item"> 
                    <div><i class="fa-brands fa-sistrix"></i></div>
                    <input type="text" id="input-search" placeholder="issues..." required />
                </label>
            </div>
            <button id="btn-search" class="btn btn-primary join-item">+ New Issue</button>
            </div> 
        </div>
    </header>


    <!-- All btn section -->
    <section class="bg-white w-[80%] mx-auto p-4 mt-[60px]">
        <button id="tab-all" onclick="switchTab('all')" class="btn px-8 py-2.5" >All</button>
        <button id="tab-open" onclick="switchTab('open')" class="btn  px-8 py-2.5">Open</button>
        <button id="tab-close" onclick="switchTab('close')" class="btn  px-8 py-2.5">Closed</button>
    </section>



    <!-- All card count section -->
    <section class="flex w-[80%] mx-auto bg-white mt-4 p-6 justify-between">
       <div class="flex gap-2 items-center">
            <div class="bg-[#ECE4FF] rounded-full p-2.5">
                <img src="./assets/Aperture.png" alt="">
            </div>
            <div>
                <h2 id="count-issue" class="font-semibold text-5">50 Issue</h2>
                <p class="text-[#64748B]">Track and manage your project issues</p>
            </div>
       </div>
       <div class="flex gap-4 items-center">
           <div class="flex items-center  gap-2">
                <div class="w-2 h-2 bg-green-600 rounded-full"></div> 
                <h2>Open</h2>
           </div>
           <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-fuchsia-600 rounded-full"></div>
                <h2>Close</h2>
           </div>
       </div>

    </section>


    <!-- spiner -->
     <section id="spiner" class="flex justify-center items-center py-10 hidden">
        <span class="loading loading-bars loading-lg"></span>
     </section>



    <!-- issue section -->
     <section id="issue-container" class="w-[80%] mx-auto  my-10 grid lg:grid-cols-4  grid-cols-2 gap-5">
       
     </section>

     <!-- modal -->
      <!-- Open the modal using ID.showModal() method -->
<dialog id="word_modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    <div id="details-container" class="space-y-5">
       
    </div>
    <div class="modal-action">
      <form method="dialog">
        
        <button class="btn btn-primary">Close</button>
      </form>
    </div>
  </div>
</dialog>

    <script src="./script.js/main.js"></script>
    
</body>
</html>
